<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>No.21 감사 선행기법</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="theme-color" content="#3B6D11">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="끌어당김의 기록">
</head>
<body>
  <div class="phone-frame">
    <div class="header">
      <button class="header-back" onclick="history.back()">‹</button>
      <span class="header-title" style="color:var(--c21);">No.21 감사 선행기법</span>
      <div class="header-actions">
        <button class="icon-btn" id="themeBtn">🌙</button>
      </div>
    </div>

    <div class="page-content">
      <!-- 힌트 -->
      <div class="hint-box" style="border-color:var(--c21);">
        <strong>미래의 감정을 현재로.</strong> 아직 일어나지 않았지만 이미 일어난 것처럼, 무조건 현재형·완료형으로 적으세요.
      </div>

      <!-- DATE -->
      <div class="section">
        <div class="field-label">DATE</div>
        <input type="date" id="dateInput">
      </div>

      <!-- 미리 감사합니다 -->
      <div class="section">
        <div class="field-label">미리 감사합니다</div>
        <p style="font-size:12px;color:var(--text-hint);margin-bottom:10px;">
          디테일이 살아 있을수록 강해요. "돈이 들어와서"보다 "OO월 OO일에 OOO만 원이 통장에 들어와서".
        </p>

        <div id="gratitudeFields">
          <!-- 01~05 동적 생성 -->
        </div>
      </div>

      <!-- 지금 이 순간의 감정 -->
      <div class="section">
        <div class="field-label">지금 이 순간의 감정</div>
        <p style="font-size:12px;color:var(--text-hint);margin-bottom:8px;">
          이 감사들을 적고 나니 가슴에 남는 느낌. 감정이 안 올라오면 항목을 바꾸세요.
        </p>
        <textarea id="feeling" rows="3" placeholder="지금 이 순간 느껴지는 감정을 적어주세요…"></textarea>
      </div>

      <!-- 주의사항 -->
      <div class="hint-box" style="border-color:var(--c21);margin-bottom:20px;">
        ⚠️ <strong>"받을 거예요" 금지</strong>, "받았습니다"만. 감정을 미래가 아닌 지금으로 끌어옵니다.<br>
        마지막 감정 한 줄이 핵심입니다.
      </div>

      <button class="btn btn-21" id="saveBtn">저장하기</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    import {
      onAuthChange,
      saveGratitudeAdvance, getGratitudeAdvance,
      formatDate,
    } from './firebase.js';

    // ── 테마 ──────────────────────────────────────────────────────────────
    const root = document.documentElement;
    const themeBtn = document.getElementById('themeBtn');
    function applyTheme(t) {
      root.setAttribute('data-theme', t);
      themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
    }
    applyTheme(localStorage.getItem('theme') || 'light');
    themeBtn.addEventListener('click', () => {
      const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      localStorage.setItem('theme', next);
      applyTheme(next);
    });

    // ── 감사 입력 필드 5개 생성 ──────────────────────────────────────────
    const container = document.getElementById('gratitudeFields');
    for (let i = 0; i < 5; i++) {
      const row = document.createElement('div');
      row.className = 'num-field';
      row.style.alignItems = 'center';
      row.innerHTML = `
        <span class="num-label">${String(i + 1).padStart(2, '0')}</span>
        <div style="flex:1;display:flex;align-items:center;gap:6px;
          background:var(--card-bg);border:0.5px solid var(--border);
          border-radius:var(--r);padding:11px 14px;">
          <input type="text" id="g${i}"
            placeholder="감사한 일을 적어주세요"
            style="flex:1;border:none;border-radius:0;padding:0;background:transparent;">
          <span style="font-size:14px;color:var(--c21);white-space:nowrap;font-weight:600;">감사합니다.</span>
        </div>`;
      container.appendChild(row);
    }

    // ── 날짜 ─────────────────────────────────────────────────────────────
    const dateInput = document.getElementById('dateInput');
    dateInput.value = formatDate(new Date());

    // ── 토스트 ────────────────────────────────────────────────────────────
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    // ── 기존 데이터 로드 ──────────────────────────────────────────────────
    let currentUid = null;

    async function loadData(uid, date) {
      const data = await getGratitudeAdvance(uid, date);
      if (!data) return;
      (data.gratitudes || []).forEach((v, i) => {
        const el = document.getElementById(`g${i}`);
        if (el) el.value = v || '';
      });
      document.getElementById('feeling').value = data.feeling || '';
    }

    dateInput.addEventListener('change', () => {
      if (currentUid) loadData(currentUid, dateInput.value);
    });

    // ── 인증 ──────────────────────────────────────────────────────────────
    onAuthChange(async user => {
      if (!user) { window.location.replace('index.html'); return; }
      currentUid = user.uid;
      await loadData(user.uid, dateInput.value);
    });

    // ── 저장 ──────────────────────────────────────────────────────────────
    document.getElementById('saveBtn').addEventListener('click', async () => {
      if (!currentUid) return;

      const gratitudes = Array.from({ length: 5 }, (_, i) =>
        (document.getElementById(`g${i}`)?.value || '').trim()
      );

      if (gratitudes.every(g => !g)) {
        showToast('감사한 일을 하나 이상 입력해주세요.');
        return;
      }

      const saveBtn = document.getElementById('saveBtn');
      saveBtn.disabled = true;
      saveBtn.textContent = '저장 중…';

      try {
        await saveGratitudeAdvance(currentUid, dateInput.value, {
          gratitudes,
          feeling: document.getElementById('feeling').value.trim(),
        });
        showToast('✓ 저장되었습니다');
        setTimeout(() => window.location.href = 'home.html', 1200);
      } catch (e) {
        showToast('저장에 실패했습니다. 다시 시도해주세요.');
        saveBtn.disabled = false;
        saveBtn.textContent = '저장하기';
      }
    });
  </script>
</body>
</html>
