<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HARD 노트 — 끌어당김의 기록</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="theme-color" content="#6A3EC0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="끌어당김의 기록">
</head>
<body>
  <div class="phone-frame">
    <div class="header">
      <button class="header-back" onclick="history.back()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <span class="header-title">HARD 노트</span>
      <div class="header-dot" style="background:var(--c28);"></div>
    </div>

    <div class="page-content">

      <!-- 날짜 + 키워드 -->
      <div style="display:flex;gap:12px;margin-bottom:20px;">
        <div class="card" style="flex:1;padding:12px 14px;">
          <div class="section-label" style="margin-bottom:6px;">DATE</div>
          <input type="date" id="dateInput" style="border:none;background:transparent;font-family:inherit;font-size:14px;font-weight:700;color:var(--text);width:100%;outline:none;">
        </div>
        <div class="card" style="flex:1;padding:12px 14px;background:var(--c28bg);">
          <div class="section-label" style="margin-bottom:6px;color:var(--c28);">이번 주 키워드</div>
          <input type="text" id="keyword" placeholder="확신" maxlength="20"
            style="border:none;background:transparent;font-family:inherit;font-size:14px;font-weight:700;color:var(--c28);width:100%;outline:none;">
        </div>
      </div>

      <!-- 2×2 그리드 -->
      <div class="hard-grid">

        <!-- H: Have -->
        <div class="hard-q hard-q-H">
          <div class="hard-q-header">
            <div class="hard-q-letter" style="color:var(--c17);">H</div>
            <div>
              <div class="hard-q-name" style="color:var(--c17);">Have</div>
              <div class="hard-q-tag">지금 가진 것</div>
            </div>
          </div>
          <input class="hard-line-input" type="text" maxlength="100" id="h0" placeholder="건강한 몸">
          <input class="hard-line-input" type="text" maxlength="100" id="h1" placeholder="안전한 거처">
          <input class="hard-line-input" type="text" maxlength="100" id="h2" placeholder="곁의 사람">
          <input class="hard-line-input" type="text" maxlength="100" id="h3" placeholder="가진 재능">
          <input class="hard-line-input" type="text" maxlength="100" id="h4" placeholder="">
        </div>

        <!-- A: Act -->
        <div class="hard-q hard-q-A">
          <div class="hard-q-header">
            <div class="hard-q-letter" style="color:var(--c21);">A</div>
            <div>
              <div class="hard-q-name" style="color:var(--c21);">Act</div>
              <div class="hard-q-tag">이번 주 실천</div>
            </div>
          </div>
          <input class="hard-line-input" type="text" maxlength="100" id="a0" placeholder="">
          <input class="hard-line-input" type="text" maxlength="100" id="a1" placeholder="">
          <input class="hard-line-input" type="text" maxlength="100" id="a2" placeholder="">
          <input class="hard-line-input" type="text" maxlength="100" id="a3" placeholder="">
          <input class="hard-line-input" type="text" maxlength="100" id="a4" placeholder="">
        </div>

        <!-- R: Realized -->
        <div class="hard-q hard-q-R">
          <div class="hard-q-header">
            <div class="hard-q-letter" style="color:var(--c28);">R</div>
            <div>
              <div class="hard-q-name" style="color:var(--c28);">Realized</div>
              <div class="hard-q-tag">이미 이루어진 것</div>
            </div>
          </div>
          <input class="hard-line-input" type="text" maxlength="100" id="r0" placeholder="">
          <input class="hard-line-input" type="text" maxlength="100" id="r1" placeholder="">
          <input class="hard-line-input" type="text" maxlength="100" id="r2" placeholder="">
          <input class="hard-line-input" type="text" maxlength="100" id="r3" placeholder="">
          <input class="hard-line-input" type="text" maxlength="100" id="r4" placeholder="">
        </div>

        <!-- D: Dream -->
        <div class="hard-q hard-q-D">
          <div class="hard-q-header">
            <div class="hard-q-letter" style="color:var(--cd);">D</div>
            <div>
              <div class="hard-q-name" style="color:var(--cd);">Dream</div>
              <div class="hard-q-tag">꿈꾸는 것</div>
            </div>
          </div>
          <input class="hard-line-input" type="text" maxlength="100" id="d0" placeholder="">
          <input class="hard-line-input" type="text" maxlength="100" id="d1" placeholder="">
          <input class="hard-line-input" type="text" maxlength="100" id="d2" placeholder="">
          <input class="hard-line-input" type="text" maxlength="100" id="d3" placeholder="">
          <input class="hard-line-input" type="text" maxlength="100" id="d4" placeholder="">
        </div>

      </div>

      <button class="btn btn-28" id="saveBtn">HARD 노트 저장</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    import {
      waitForAuth, onAuthChange,
      saveHardNote, getHardNote,
      formatDate, getWeekKey,
    } from './firebase.js';
    import { initTheme, showToast } from './utils.js';

    initTheme();

    const dateInput = document.getElementById('dateInput');
    dateInput.value = formatDate(new Date());

    document.querySelectorAll('input[type="text"], textarea').forEach(el => {
      el.addEventListener('input', () => { el.value = el.value.replace(/[<>&]/g, ''); });
    });

    function getInputs(prefix) {
      return Array.from({ length: 5 }, (_, i) =>
        (document.getElementById(`${prefix}${i}`)?.value || '').trim()
      );
    }
    function fillInputs(prefix, arr) {
      (arr || []).forEach((v, i) => {
        const el = document.getElementById(`${prefix}${i}`);
        if (el) el.value = v || '';
      });
    }

    let currentUid = null;

    async function loadData(uid, date) {
      const weekKey = getWeekKey(new Date(date));
      const data = await getHardNote(uid, weekKey);
      if (!data) return;
      document.getElementById('keyword').value = data.keyword || '';
      fillInputs('h', data.have);
      fillInputs('a', data.achieved);
      fillInputs('r', data.receive);
      fillInputs('d', data.do);
    }

    dateInput.addEventListener('change', () => {
      if (currentUid) loadData(currentUid, dateInput.value);
    });

    const user = await waitForAuth();
    if (!user) { window.location.replace('index.html'); }
    else {
      onAuthChange(u => { if (!u) window.location.replace('index.html'); });
      currentUid = user.uid;
      await loadData(user.uid, dateInput.value);
    }

    document.getElementById('saveBtn').addEventListener('click', async () => {
      if (!currentUid) return;
      const weekKey = getWeekKey(new Date(dateInput.value));
      const saveBtn = document.getElementById('saveBtn');
      saveBtn.disabled = true;
      saveBtn.textContent = '저장 중…';
      try {
        await saveHardNote(currentUid, weekKey, {
          keyword:  document.getElementById('keyword').value.trim(),
          have:     getInputs('h'),
          achieved: getInputs('a'),
          receive:  getInputs('r'),
          do:       getInputs('d'),
        });
        showToast('✓ 저장되었습니다');
        setTimeout(() => window.location.href = 'home.html', 1200);
      } catch (e) {
        showToast('저장에 실패했습니다. 다시 시도해주세요.');
        saveBtn.disabled = false;
        saveBtn.textContent = 'HARD 노트 저장';
      }
    });
  </script>
</body>
</html>
