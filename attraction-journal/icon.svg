<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A4D0C"/>
      <stop offset="100%" stop-color="#111410"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5F2EA"/>
      <stop offset="100%" stop-color="#C8E0A8"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- 은은한 글로우 -->
  <ellipse cx="256" cy="240" rx="180" ry="160" fill="#3B6D11" opacity="0.18"/>

  <!-- 메인 4각 별 (sparkle) -->
  <path d="M256,96 L282,228 L412,256 L282,284 L256,416 L230,284 L100,256 L230,228 Z"
        fill="url(#star)"/>

  <!-- 작은 포인트 -->
  <circle cx="362" cy="152" r="18" fill="#EAF3DE" opacity="0.65"/>
  <circle cx="152" cy="362" r="11" fill="#EAF3DE" opacity="0.45"/>
  <circle cx="374" cy="346" r="8"  fill="#EAF3DE" opacity="0.35"/>
</svg>
