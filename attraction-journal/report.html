<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주간 리포트 — 끌어당김의 기록</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="theme-color" content="#6A3EC0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="끌어당김의 기록">
</head>
<body>
  <div class="phone-frame">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:18px 20px 12px;">
      <div style="font-size:17px;font-weight:800;">주간 리포트</div>
      <button class="theme-btn" id="themeBtn" aria-label="테마 전환">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4 6.3 6.3 0 0 0 20 14.5z"/></svg>
      </button>
    </div>

    <div class="page-content" id="reportContent">
      <div style="text-align:center;padding:40px 0;color:var(--hint);">불러오는 중…</div>
    </div>

    <nav class="bottom-nav">
      <a class="bottom-nav-item" href="home.html">
        <svg class="bottom-nav-icon" width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 5l8 6.5"/><path d="M6 10.5V19h12v-8.5"/></svg>
        <span class="bottom-nav-label">홈</span>
      </a>
      <a class="bottom-nav-item" href="history.html">
        <svg class="bottom-nav-icon" width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M4 9.5h16M9 3.5v3M15 3.5v3"/></svg>
        <span class="bottom-nav-label">기록</span>
      </a>
      <a class="bottom-nav-item active" href="report.html">
        <svg class="bottom-nav-icon" width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19V4M5 19h15"/><path d="M9 16v-4M13 16V8M17 16v-6"/></svg>
        <span class="bottom-nav-label">리포트</span>
      </a>
      <a class="bottom-nav-item" href="vision.html">
        <svg class="bottom-nav-icon" width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="2.6"/></svg>
        <span class="bottom-nav-label">비전</span>
      </a>
    </nav>
  </div>

  <script type="module">
    import { waitForAuth, onAuthChange, getThisWeekEntries, getWeekKey, formatDate, WEEKDAYS } from './firebase.js';
    import { initTheme } from './utils.js';

    initTheme();

    const STOPWORDS = new Set([
      '나는','나의','내가','나를','나에게','나도','나만','나로','우리','이것','그것','저것',
      '여기','거기','저기','오늘','어제','내일','이번','지난','다음','매일','항상','지금',
      '아직','이미','그리고','하지만','그래서','그런데','또한','또','더','정말','너무','매우',
      '아주','모두','모든','사실','진짜','있다','없다','이다','됐다','합니다','했다','좋다',
      '좋은','같은','같이','처럼','한다','하는','하고','하면','것이','것을','것은','것도',
    ]);

    function extractKeywords(text) {
      if (!text) return [];
      return text.split(/[\s,·]+/)
        .map(w => w.replace(/[^가-힣a-zA-Z0-9]/g, '').trim())
        .filter(w => w.length >= 2 && !STOPWORDS.has(w));
    }

    function topKeywords(list, limit = 10) {
      const freq = {};
      list.forEach(w => { freq[w] = (freq[w] || 0) + 1; });
      return Object.entries(freq).sort((a, b) => b[1] - a[1]).slice(0, limit).map(([w]) => w);
    }

    function encouragement(diaryCount, gratCount, hardDone) {
      const lines = [
        `이번 주 ${diaryCount}번의 자기증명과 ${gratCount}번의 감사를 기록했어요. 꾸준히 쌓이는 당신이 멋집니다.`,
        `기록은 거짓말을 하지 않습니다. 이번 주 당신은 분명히 움직였어요.`,
        `작은 글자 하나하나가 현실을 끌어당기고 있어요. 계속 써주세요.`,
        `이번 주도 자신에게 집중한 시간이 있었습니다. 그게 전부예요.`,
        `감사의 감정이 쌓일수록 인식이 달라집니다. 당신은 잘 하고 있어요.`,
      ];
      const extra = hardDone ? ' HARD 노트까지 채운 한 주, 정말 대단합니다.' : '';
      return lines[diaryCount % lines.length] + extra;
    }

    function weekDates(startDate) {
      const dates = [];
      const start = new Date(startDate);
      for (let i = 0; i < 7; i++) {
        const d = new Date(start); d.setDate(start.getDate() + i); dates.push(formatDate(d));
      }
      return dates;
    }

    function render({ diary, gratitude, hard, startDate, endDate }) {
      const dates    = weekDates(startDate);
      const diaryDays = dates.filter(d => diary[d]);
      const gratDays  = dates.filter(d => gratitude[d]);
      const hardDone  = !!hard;

      const allGratTexts = [];
      gratDays.forEach(d => (gratitude[d].gratitudes || []).forEach(g => { if (g) allGratTexts.push(g); }));

      const declWords = [];
      diaryDays.forEach(d => { if (diary[d].declaration) declWords.push(...extractKeywords(diary[d].declaration)); });

      const gratWords = [];
      allGratTexts.forEach(t => gratWords.push(...extractKeywords(t)));

      // 바 차트: 각 요일별 기록 여부 → 높이
      const barChartHTML = dates.map((date, i) => {
        const has17 = !!diary[date];
        const has21 = !!gratitude[date];
        const has28 = hardDone && i === 6;
        const count = [has17, has21, has28].filter(Boolean).length;
        const pct   = count === 0 ? '0%' : count === 1 ? '33%' : count === 2 ? '66%' : '100%';
        const color = has17 ? 'var(--c17)' : has21 ? 'var(--c21)' : has28 ? 'var(--c28)' : 'transparent';
        const isToday = date === formatDate(new Date());
        return `
          <div style="display:flex;flex-direction:column;align-items:center;gap:9px;flex:1;">
            <div style="width:14px;height:54px;border-radius:8px;background:var(--c17bg);position:relative;overflow:hidden;display:flex;align-items:flex-end;">
              <div style="width:100%;height:${pct};background:${color};border-radius:8px;transition:height .4s;"></div>
            </div>
            <div style="font-size:11px;font-weight:700;color:${isToday ? 'var(--c17)' : 'var(--hint)'};">${WEEKDAYS[i]}</div>
          </div>`;
      }).join('');

      const identKeywords = topKeywords(declWords, 8);
      const identHTML = identKeywords.length
        ? identKeywords.map(k => `<div class="chip chip-17">${k}</div>`).join('')
        : '<span style="color:var(--hint);font-size:13px;">이번 주 기록이 없어요</span>';

      const gratKeywords = topKeywords(gratWords, 10);
      const gratHTML = gratKeywords.length
        ? gratKeywords.map(k => `<div class="chip chip-21">${k}</div>`).join('')
        : '<span style="color:var(--hint);font-size:13px;">이번 주 감사 기록이 없어요</span>';

      const weekKey = getWeekKey(new Date(startDate));

      document.getElementById('reportContent').innerHTML = `
        <div style="font-size:13px;color:var(--text2);margin-bottom:18px;">${startDate} ~ ${endDate} · ${weekKey}주차</div>

        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:24px;">
          <div style="background:var(--c17bg);border:1px solid var(--border);border-radius:16px;padding:16px 12px;text-align:center;">
            <div style="font-size:30px;font-weight:800;color:var(--c17);line-height:1;letter-spacing:-1px;">${diaryDays.length}</div>
            <div style="font-size:11px;color:var(--text2);margin-top:7px;font-weight:600;">자기증명</div>
          </div>
          <div style="background:var(--c21bg);border:1px solid var(--border);border-radius:16px;padding:16px 12px;text-align:center;">
            <div style="font-size:30px;font-weight:800;color:var(--c21);line-height:1;letter-spacing:-1px;">${gratDays.length}</div>
            <div style="font-size:11px;color:var(--text2);margin-top:7px;font-weight:600;">감사 기록</div>
          </div>
          <div style="background:var(--c21bg);border:1px solid var(--border);border-radius:16px;padding:16px 12px;text-align:center;">
            <div style="font-size:30px;font-weight:800;color:var(--c21);line-height:1;letter-spacing:-1px;">${allGratTexts.filter(Boolean).length}</div>
            <div style="font-size:11px;color:var(--text2);margin-top:7px;font-weight:600;">감사 항목</div>
          </div>
        </div>

        <div class="section-label">요일별 작성 현황</div>
        <div class="card" style="display:flex;justify-content:space-between;padding:18px 14px;margin-bottom:24px;">
          ${barChartHTML}
        </div>

        <div class="section-label">이번 주 정체성 키워드</div>
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px;">${identHTML}</div>

        <div class="section-label">감사 키워드</div>
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px;">${gratHTML}</div>

        <div class="encouragement">${encouragement(diaryDays.length, gratDays.length, hardDone)}</div>
      `;
    }

    const user = await waitForAuth();
    if (!user) { window.location.replace('index.html'); }
    else {
      onAuthChange(u => { if (!u) window.location.replace('index.html'); });
      try {
        const data = await getThisWeekEntries(user.uid);
        render(data);
      } catch (e) {
        document.getElementById('reportContent').innerHTML =
          '<div style="text-align:center;padding:40px 0;color:var(--hint);">데이터를 불러오지 못했습니다.</div>';
      }
    }
  </script>
</body>
</html>
