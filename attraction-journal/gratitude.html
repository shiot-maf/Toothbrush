<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>감사 선행기법 — 끌어당김의 기록</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="theme-color" content="#6A3EC0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="끌어당김의 기록">
</head>
<body>
  <div class="phone-frame">
    <div class="header">
      <button class="header-back" onclick="history.back()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <span class="header-title">감사 선행기법</span>
      <div class="header-dot" style="background:var(--c21);"></div>
    </div>

    <div class="page-content">
      <div class="hint-box hint-21">
        이미 받은 것처럼 감사하세요. 감사는 더 많은 풍요를 끌어당기는 가장 강력한 주파수입니다.
      </div>

      <input type="date" id="dateInput" style="display:none;">

      <div class="section-label">다섯 가지 감사</div>
      <div id="gratitudeFields" style="display:flex;flex-direction:column;gap:10px;margin-bottom:24px;"></div>

      <div class="section-label">지금 이 순간의 감정</div>
      <div class="card" style="margin-bottom:28px;">
        <textarea id="feeling" rows="3" maxlength="300"
          placeholder="감사로 가득 찬 지금의 느낌을 적어보세요"
          style="width:100%;border:none;background:transparent;resize:none;font-family:inherit;font-size:14.5px;color:var(--text);line-height:1.6;min-height:66px;outline:none;"></textarea>
      </div>

      <button class="btn btn-21" id="saveBtn">감사 기록 저장</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    import {
      waitForAuth, onAuthChange,
      saveGratitudeAdvance, getGratitudeAdvance,
      formatDate,
    } from './firebase.js';
    import { initTheme, showToast } from './utils.js';

    initTheme();

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = el.scrollHeight + 'px';
    }

    // 감사 항목 5개 생성
    const container = document.getElementById('gratitudeFields');
    for (let i = 0; i < 5; i++) {
      const row = document.createElement('div');
      row.className = 'ev-row card';
      row.innerHTML = `
        <span class="ev-num ev-21">${String(i + 1).padStart(2, '0')}</span>
        <input type="text" id="g${i}" placeholder="감사한 것" maxlength="100"
          style="flex:1;border:none;background:transparent;font-family:inherit;font-size:14.5px;color:var(--text);outline:none;min-width:0;">
        <span style="font-size:12.5px;color:var(--hint);flex:none;font-weight:500;white-space:nowrap;">감사합니다</span>`;
      container.appendChild(row);
    }

    document.querySelectorAll('input[type="text"], textarea').forEach(el => {
      el.addEventListener('input', () => { el.value = el.value.replace(/[<>&]/g, ''); });
    });

    const feeling = document.getElementById('feeling');
    feeling.addEventListener('input', () => autoResize(feeling));

    const dateInput = document.getElementById('dateInput');
    dateInput.value = formatDate(new Date());

    let currentUid = null;

    async function loadData(uid, date) {
      const data = await getGratitudeAdvance(uid, date);
      if (!data) return;
      (data.gratitudes || []).forEach((v, i) => {
        const el = document.getElementById(`g${i}`);
        if (el) el.value = v || '';
      });
      feeling.value = data.feeling || '';
      autoResize(feeling);
    }

    dateInput.addEventListener('change', () => {
      if (currentUid) loadData(currentUid, dateInput.value);
    });

    const user = await waitForAuth();
    if (!user) { window.location.replace('index.html'); }
    else {
      onAuthChange(u => { if (!u) window.location.replace('index.html'); });
      currentUid = user.uid;
      await loadData(user.uid, dateInput.value);
    }

    document.getElementById('saveBtn').addEventListener('click', async () => {
      if (!currentUid) return;
      const gratitudes = Array.from({ length: 5 }, (_, i) =>
        (document.getElementById(`g${i}`)?.value || '').trim()
      );
      if (gratitudes.every(g => !g)) { showToast('감사한 일을 하나 이상 입력해주세요.'); return; }
      const saveBtn = document.getElementById('saveBtn');
      saveBtn.disabled = true;
      saveBtn.textContent = '저장 중…';
      try {
        await saveGratitudeAdvance(currentUid, dateInput.value, {
          gratitudes,
          feeling: feeling.value.trim(),
        });
        showToast('✓ 저장되었습니다');
        setTimeout(() => window.location.href = 'home.html', 1200);
      } catch (e) {
        showToast('저장에 실패했습니다. 다시 시도해주세요.');
        saveBtn.disabled = false;
        saveBtn.textContent = '감사 기록 저장';
      }
    });
  </script>
</body>
</html>
