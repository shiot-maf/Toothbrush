<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>자기증명 일기 — 끌어당김의 기록</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="theme-color" content="#6A3EC0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="끌어당김의 기록">
</head>
<body>
  <div class="phone-frame">
    <div class="header">
      <button class="header-back" onclick="history.back()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <span class="header-title">자기증명 일기</span>
      <div class="header-dot" style="background:var(--c17);"></div>
    </div>

    <div class="page-content">
      <div class="hint-box hint-17">
        이미 그런 사람인 것처럼 선언하고, 그 증거를 찾아보세요. 정체성이 현실을 끌어당깁니다.
      </div>

      <input type="date" id="dateInput" style="display:none;">

      <div class="section-label">선언</div>
      <div class="decl-row card" style="border-color:var(--border);margin-bottom:24px;">
        <span style="font-size:16px;white-space:nowrap;">나는</span>
        <input class="decl-input" type="text" id="declaration" placeholder="어떤" maxlength="50">
        <span style="font-size:16px;white-space:nowrap;">한 사람이다.</span>
      </div>

      <div class="section-label">오늘의 증거</div>
      <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:24px;">
        <div class="ev-row card">
          <span class="ev-num ev-17">01</span>
          <textarea class="ev-textarea" id="ev0" placeholder="그 정체성을 증명한 오늘의 일" maxlength="100" rows="1"></textarea>
        </div>
        <div class="ev-row card">
          <span class="ev-num ev-17">02</span>
          <textarea class="ev-textarea" id="ev1" placeholder="그 정체성을 증명한 오늘의 일" maxlength="100" rows="1"></textarea>
        </div>
        <div class="ev-row card">
          <span class="ev-num ev-17">03</span>
          <textarea class="ev-textarea" id="ev2" placeholder="그 정체성을 증명한 오늘의 일" maxlength="100" rows="1"></textarea>
        </div>
      </div>

      <div class="section-label">마무리</div>
      <div class="decl-row card" style="border-color:var(--border);margin-bottom:28px;">
        <span style="font-size:16px;white-space:nowrap;flex-shrink:0;">오늘의 나는 분명히</span>
        <input class="decl-input" type="text" id="conclusion" placeholder="어떤" maxlength="50">
        <span style="font-size:16px;white-space:nowrap;">한 사람이었다.</span>
      </div>

      <button class="btn btn-17" id="saveBtn">오늘의 선언 저장</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    import {
      waitForAuth, onAuthChange,
      saveIdentityDiary, getIdentityDiary,
      formatDate,
    } from './firebase.js';
    import { initTheme, showToast } from './utils.js';

    initTheme();

    const dateInput = document.getElementById('dateInput');
    dateInput.value = formatDate(new Date());

    let currentUid = null;

    async function loadData(uid, date) {
      const data = await getIdentityDiary(uid, date);
      if (!data) return;
      document.getElementById('declaration').value = data.declaration  || '';
      document.getElementById('ev0').value         = data.evidence?.[0] || '';
      document.getElementById('ev1').value         = data.evidence?.[1] || '';
      document.getElementById('ev2').value         = data.evidence?.[2] || '';
      document.getElementById('conclusion').value  = data.conclusion   || '';
      document.querySelectorAll('textarea').forEach(el => autoResize(el));
    }

    dateInput.addEventListener('change', () => {
      if (currentUid) loadData(currentUid, dateInput.value);
    });

    const user = await waitForAuth();
    if (!user) { window.location.replace('index.html'); }
    else {
      onAuthChange(u => { if (!u) window.location.replace('index.html'); });
      currentUid = user.uid;
      await loadData(user.uid, dateInput.value);
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = el.scrollHeight + 'px';
    }
    document.querySelectorAll('textarea').forEach(el => {
      el.addEventListener('input', () => autoResize(el));
    });

    document.querySelectorAll('input[type="text"], textarea').forEach(el => {
      el.addEventListener('input', () => { el.value = el.value.replace(/[<>&]/g, ''); });
    });

    document.getElementById('saveBtn').addEventListener('click', async () => {
      if (!currentUid) return;
      const declaration = document.getElementById('declaration').value.trim();
      if (!declaration) { showToast('선언을 입력해주세요.'); return; }
      const saveBtn = document.getElementById('saveBtn');
      saveBtn.disabled = true;
      saveBtn.textContent = '저장 중…';
      try {
        await saveIdentityDiary(currentUid, dateInput.value, {
          declaration,
          evidence: [
            document.getElementById('ev0').value.trim(),
            document.getElementById('ev1').value.trim(),
            document.getElementById('ev2').value.trim(),
          ],
          conclusion: document.getElementById('conclusion').value.trim(),
        });
        showToast('✓ 저장되었습니다');
        setTimeout(() => window.location.href = 'home.html', 1200);
      } catch (e) {
        showToast('저장에 실패했습니다. 다시 시도해주세요.');
        saveBtn.disabled = false;
        saveBtn.textContent = '오늘의 선언 저장';
      }
    });
  </script>
</body>
</html>
