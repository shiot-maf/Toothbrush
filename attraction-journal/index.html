<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>끌어당김의 기록</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="theme-color" content="#6A3EC0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="끌어당김의 기록">
</head>
<body>
  <div class="phone-frame">
    <div class="login-wrap">
      <!-- 테마 버튼 -->
      <button class="theme-btn" id="themeBtn" aria-label="테마 전환" style="position:absolute;top:20px;right:20px;z-index:2;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4 6.3 6.3 0 0 0 20 14.5z"/></svg>
      </button>

      <!-- 배경 블러 -->
      <div class="login-glow"></div>

      <!-- 로고 -->
      <div class="login-logo-wrap">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="var(--c17)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3l1.9 5.4L19 10l-5.1 1.6L12 17l-1.9-5.4L5 10l5.1-1.6z" stroke-linejoin="round"/>
          <path d="M19 4.5l.6 1.7 1.7.6-1.7.6L19 9l-.6-1.6L16.7 6.8l1.7-.6z" stroke-linejoin="round"/>
        </svg>
      </div>

      <h1 class="login-title">끌어당김의 기록</h1>
      <p class="login-sub">매일 세 가지 기록으로<br>원하는 나를 선명하게 그려보세요.</p>

      <button class="btn-google" id="googleBtn">
        <svg width="19" height="19" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.8-6.8C35.6 2.4 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.3l7.9 6.1C12.3 13.4 17.7 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.1 24.6c0-1.6-.1-3.1-.4-4.6H24v9.1h12.4c-.5 2.9-2.1 5.4-4.6 7l7.2 5.6c4.2-3.9 6.6-9.6 6.6-17.1z"/>
          <path fill="#FBBC05" d="M10.5 28.6c-.5-1.5-.8-3-.8-4.6s.3-3.1.8-4.6l-7.9-6.1C1 16.5 0 20.1 0 24s1 7.5 2.6 10.7l7.9-6.1z"/>
          <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.2-5.6c-2 1.4-4.6 2.2-8.7 2.2-6.3 0-11.7-3.9-13.5-9.4l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/>
        </svg>
        Google로 시작하기
      </button>

      <p id="errMsg" style="display:none;color:#E53E3E;font-size:13px;margin-top:12px;text-align:center;"></p>
      <p class="login-notice">기록은 내 계정에 안전하게 저장됩니다</p>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { signInWithGoogle, getGoogleRedirectResult, onAuthChange, getOnboardingStatus } from './firebase.js';
    import { initTheme } from './utils.js';

    initTheme();

    try {
      const result = await getGoogleRedirectResult();
      if (result?.user) { window.location.replace('home.html'); }
    } catch (e) {}

    async function redirectAfterLogin(user) {
      const onboarded = await getOnboardingStatus(user.uid);
      window.location.replace(onboarded ? 'home.html' : 'onboarding.html');
    }

    onAuthChange(user => {
      if (user) redirectAfterLogin(user);
    });

    const googleBtn = document.getElementById('googleBtn');
    const errMsg    = document.getElementById('errMsg');

    googleBtn.addEventListener('click', async () => {
      errMsg.style.display = 'none';
      googleBtn.disabled = true;
      googleBtn.textContent = '로그인 중…';
      try {
        await signInWithGoogle();
      } catch (e) {
        errMsg.textContent = '로그인에 실패했습니다. 다시 시도해주세요.';
        errMsg.style.display = 'block';
        googleBtn.disabled = false;
        googleBtn.innerHTML = `
          <svg width="19" height="19" viewBox="0 0 48 48">
            <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.8-6.8C35.6 2.4 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.3l7.9 6.1C12.3 13.4 17.7 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.1 24.6c0-1.6-.1-3.1-.4-4.6H24v9.1h12.4c-.5 2.9-2.1 5.4-4.6 7l7.2 5.6c4.2-3.9 6.6-9.6 6.6-17.1z"/>
            <path fill="#FBBC05" d="M10.5 28.6c-.5-1.5-.8-3-.8-4.6s.3-3.1.8-4.6l-7.9-6.1C1 16.5 0 20.1 0 24s1 7.5 2.6 10.7l7.9-6.1z"/>
            <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.2-5.6c-2 1.4-4.6 2.2-8.7 2.2-6.3 0-11.7-3.9-13.5-9.4l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/>
          </svg>
          Google로 시작하기`;
      }
    });
  </script>
</body>
</html>
