<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>끌어당김의 기록</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="theme-color" content="#6A3EC0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="끌어당김의 기록">
</head>
<body>
  <div class="phone-frame">
    <div class="login-wrap">
      <div class="login-logo">✨</div>
      <h1 class="login-title">끌어당김의 기록</h1>
      <p class="login-sub">세 개의 노트로 시작하는<br>끌어당김의 법칙 저널</p>

      <button class="btn-google" id="googleBtn">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
          <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
        </svg>
        Google로 시작하기
      </button>
      <p id="errMsg" style="display:none;color:#E53E3E;font-size:13px;margin-top:12px;"></p>
    </div>
  </div>

  <!-- 테마 토글 (고정) -->
  <button class="icon-btn" id="themeBtn"
    style="position:fixed;top:16px;right:16px;font-size:22px;z-index:50;"
    aria-label="테마 전환">🌙</button>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { signInWithGoogle, getGoogleRedirectResult, onAuthChange, getOnboardingStatus } from './firebase.js';

    // ── 테마 ──────────────────────────────────────────────────────────────
    const root = document.documentElement;
    const themeBtn = document.getElementById('themeBtn');

    function applyTheme(t) {
      root.setAttribute('data-theme', t);
      themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
    }
    applyTheme(localStorage.getItem('theme') || 'light');

    themeBtn.addEventListener('click', () => {
      const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      localStorage.setItem('theme', next);
      applyTheme(next);
    });

    // ── 리다이렉트 방식으로 돌아온 경우 처리 ────────────────────────────
    try {
      const result = await getGoogleRedirectResult();
      if (result?.user) { window.location.replace('home.html'); }
    } catch (e) { /* 리다이렉트 결과 없음 — 무시 */ }

    // ── 로그인 후 온보딩 여부에 따라 이동 ───────────────────────────────
    async function redirectAfterLogin(user) {
      const onboarded = await getOnboardingStatus(user.uid);
      window.location.replace(onboarded ? 'home.html' : 'onboarding.html');
    }

    onAuthChange(user => {
      if (user) redirectAfterLogin(user);
    });

    // ── Google 로그인 ─────────────────────────────────────────────────────
    const googleBtn = document.getElementById('googleBtn');
    const errMsg    = document.getElementById('errMsg');

    googleBtn.addEventListener('click', async () => {
      errMsg.style.display = 'none';
      googleBtn.disabled = true;
      googleBtn.textContent = '로그인 중…';
      try {
        await signInWithGoogle();
        // onAuthChange가 리다이렉트 처리
      } catch (e) {
        errMsg.textContent = '로그인에 실패했습니다. 다시 시도해주세요.';
        errMsg.style.display = 'block';
        googleBtn.disabled = false;
        googleBtn.innerHTML = `
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/>
            <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
            <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
            <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
          </svg>
          Google로 시작하기`;
      }
    });
  </script>
</body>
</html>
