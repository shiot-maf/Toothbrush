<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시작하기 — 끌어당김의 기록</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="theme-color" content="#6A3EC0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="끌어당김의 기록">
</head>
<body>
  <div class="phone-frame">
    <div class="onb-frame" id="onbFrame">

      <!-- 화면 1 -->
      <div class="onb-screen active" id="screen0" style="background:linear-gradient(160deg,#1d2a24,#16263a 60%,#1a1530);">
        <div class="onb-glow" style="background:#2e6f56;top:-60px;right:-40px;"></div>
        <div class="onb-glow" style="background:#3a4f8a;bottom:120px;left:-60px;width:200px;height:200px;"></div>
        <div style="display:flex;justify-content:flex-end;padding:22px 24px;position:relative;z-index:2;">
          <button class="onb-skip" onclick="finish()">건너뛰기</button>
        </div>
        <div class="onb-body">
          <div class="onb-orbit">
            <div class="onb-orbit-ring"></div>
            <div class="onb-orbit-icon">
              <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#F4EEFF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.4L19 10l-5.1 1.6L12 17l-1.9-5.4L5 10l5.1-1.6z" stroke-linejoin="round"/></svg>
            </div>
          </div>
          <div class="onb-kicker">WELCOME</div>
          <h1 class="onb-title">당신은 이미<br>충분합니다</h1>
          <p class="onb-desc">매일 세 가지 기록으로<br>원하는 나를 선명하게 그려보세요.</p>
        </div>
        <div class="onb-footer">
          <div class="onb-dots">
            <div class="onb-dot active"></div>
            <div class="onb-dot"></div>
            <div class="onb-dot"></div>
          </div>
          <div class="onb-btns">
            <button class="onb-btn-main" onclick="goTo(1)">다음</button>
          </div>
        </div>
      </div>

      <!-- 화면 2 -->
      <div class="onb-screen" id="screen1" style="background:linear-gradient(160deg,#241a3a,#2a1530 55%,#1a1640);">
        <div class="onb-glow" style="background:#7c50d0;top:-60px;right:-40px;"></div>
        <div class="onb-glow" style="background:#c03060;bottom:120px;left:-60px;width:200px;height:200px;"></div>
        <div style="display:flex;justify-content:flex-end;padding:22px 24px;position:relative;z-index:2;">
          <button class="onb-skip" onclick="finish()">건너뛰기</button>
        </div>
        <div class="onb-body">
          <div class="onb-orbit">
            <div class="onb-orbit-ring"></div>
            <div class="onb-orbit-icon">
              <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#F4EEFF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l8 4-8 4-8-4z"/><path d="M4 12l8 4 8-4"/></svg>
            </div>
          </div>
          <div class="onb-kicker">PRACTICE</div>
          <h1 class="onb-title">세 가지 노트로<br>정체성을 다집니다</h1>
          <p class="onb-desc">자기증명 · 감사 선행 · HARD 노트.<br>끌어당김의 법칙을 매일의 습관으로.</p>
        </div>
        <div class="onb-footer">
          <div class="onb-dots">
            <div class="onb-dot"></div>
            <div class="onb-dot active"></div>
            <div class="onb-dot"></div>
          </div>
          <div class="onb-btns">
            <button class="onb-btn-ghost" onclick="goTo(0)">이전</button>
            <button class="onb-btn-main" onclick="goTo(2)">다음</button>
          </div>
        </div>
      </div>

      <!-- 화면 3 -->
      <div class="onb-screen" id="screen2" style="background:linear-gradient(160deg,#2a1d3a,#33201c 60%,#1f1530);">
        <div class="onb-glow" style="background:#c07820;top:-60px;right:-40px;"></div>
        <div class="onb-glow" style="background:#7c50d0;bottom:120px;left:-60px;width:200px;height:200px;"></div>
        <div style="display:flex;justify-content:flex-end;padding:22px 24px;position:relative;z-index:2;">
          <button class="onb-skip" onclick="finish()">건너뛰기</button>
        </div>
        <div class="onb-body">
          <div class="onb-orbit">
            <div class="onb-orbit-ring"></div>
            <div class="onb-orbit-icon">
              <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#F4EEFF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="2.6"/></svg>
            </div>
          </div>
          <div class="onb-kicker">VISION</div>
          <h1 class="onb-title">5년 후의 나를<br>오늘 만나세요</h1>
          <p class="onb-desc">매일의 기록이 모여<br>선명한 미래가 됩니다.</p>
        </div>
        <div class="onb-footer">
          <div class="onb-dots">
            <div class="onb-dot"></div>
            <div class="onb-dot"></div>
            <div class="onb-dot active"></div>
          </div>
          <div class="onb-btns">
            <button class="onb-btn-ghost" onclick="goTo(1)">이전</button>
            <button class="onb-btn-main" id="startBtn" onclick="finish()">시작하기</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script type="module">
    import { waitForAuth, setOnboardingComplete } from './firebase.js';

    let currentUid = null;
    let cur = 0;

    window.goTo = function(idx) {
      document.getElementById(`screen${cur}`).classList.remove('active');
      cur = idx;
      document.getElementById(`screen${cur}`).classList.add('active');
    };

    window.finish = async function() {
      const btn = document.getElementById('startBtn');
      if (btn) btn.disabled = true;
      if (currentUid) await setOnboardingComplete(currentUid);
      window.location.replace('home.html');
    };

    const user = await waitForAuth();
    if (!user) { window.location.replace('index.html'); }
    else { currentUid = user.uid; }
  </script>
</body>
</html>
