<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <clipPath id="c4"><circle cx="20" cy="20" r="20"/></clipPath>
  <g clip-path="url(#c4)">
    <!-- BG: mint green -->
    <rect width="40" height="40" fill="#6fcf97"/>
    <rect y="24" width="40" height="16" fill="#4daf77"/>
    <!-- Hair (curly/round top) -->
    <ellipse cx="20" cy="10" rx="14" ry="10" fill="#2a4a2a"/>
    <!-- Hair extra curl -->
    <ellipse cx="8" cy="14" rx="5" ry="7" fill="#2a4a2a"/>
    <ellipse cx="32" cy="14" rx="5" ry="7" fill="#2a4a2a"/>
    <!-- Face -->
    <rect x="10" y="12" width="20" height="20" rx="6" fill="#e8d0b0"/>
    <!-- Round glasses (circle style) -->
    <circle cx="16" cy="20" r="4.5" fill="none" stroke="#2a4a2a" stroke-width="1.5"/>
    <circle cx="24" cy="20" r="4.5" fill="none" stroke="#2a4a2a" stroke-width="1.5"/>
    <line x1="20.5" y1="20" x2="19.5" y2="20" stroke="#2a4a2a" stroke-width="1.5"/>
    <line x1="7" y1="20" x2="11.5" y2="20" stroke="#2a4a2a" stroke-width="1"/>
    <line x1="28.5" y1="20" x2="33" y2="20" stroke="#2a4a2a" stroke-width="1"/>
    <!-- Eyes -->
    <circle cx="16" cy="20" r="2" fill="#2a4a2a"/>
    <circle cx="24" cy="20" r="2" fill="#2a4a2a"/>
    <circle cx="15" cy="19" r="0.7" fill="white"/>
    <circle cx="23" cy="19" r="0.7" fill="white"/>
    <!-- Smile (content) -->
    <path d="M 15 27 Q 20 30 25 27" stroke="#b06040" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Blush -->
    <ellipse cx="12" cy="26" rx="3" ry="1.8" fill="#f5a080" opacity="0.4"/>
    <ellipse cx="28" cy="26" rx="3" ry="1.8" fill="#f5a080" opacity="0.4"/>
  </g>
</svg>
