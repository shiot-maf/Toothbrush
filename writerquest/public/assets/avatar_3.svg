<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <clipPath id="c3"><circle cx="20" cy="20" r="20"/></clipPath>
  <g clip-path="url(#c3)">
    <!-- BG: warm orange -->
    <rect width="40" height="40" fill="#e8a060"/>
    <rect y="24" width="40" height="16" fill="#c87840"/>
    <!-- Cat ears -->
    <polygon points="9,12 5,2 14,8" fill="#d07840"/>
    <polygon points="31,12 35,2 26,8" fill="#d07840"/>
    <polygon points="9,11 7,4 13,8" fill="#f0a880" opacity="0.7"/>
    <polygon points="31,11 33,4 27,8" fill="#f0a880" opacity="0.7"/>
    <!-- Hair/head -->
    <rect x="6" y="7" width="28" height="16" rx="8" fill="#d07840"/>
    <!-- Face -->
    <rect x="10" y="13" width="20" height="19" rx="6" fill="#f8d8b8"/>
    <!-- Eyes (cat eyes: almond shaped) -->
    <ellipse cx="16" cy="21" rx="4" ry="3" fill="#1a1a2e"/>
    <ellipse cx="24" cy="21" rx="4" ry="3" fill="#1a1a2e"/>
    <ellipse cx="15" cy="21" rx="1.5" ry="2" fill="#f8d8b8" opacity="0.7"/>
    <ellipse cx="23" cy="21" rx="1.5" ry="2" fill="#f8d8b8" opacity="0.7"/>
    <!-- Cat nose -->
    <polygon points="20,25 18.5,27 21.5,27" fill="#e88080"/>
    <!-- Cat mouth (w shape) -->
    <path d="M 16 27 Q 18 29 20 27 Q 22 29 24 27" stroke="#c06060" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <!-- Whisker marks -->
    <line x1="8" y1="25" x2="14" y2="26" stroke="#c07040" stroke-width="0.8" opacity="0.6"/>
    <line x1="8" y1="27" x2="14" y2="27" stroke="#c07040" stroke-width="0.8" opacity="0.6"/>
    <line x1="32" y1="25" x2="26" y2="26" stroke="#c07040" stroke-width="0.8" opacity="0.6"/>
    <line x1="32" y1="27" x2="26" y2="27" stroke="#c07040" stroke-width="0.8" opacity="0.6"/>
  </g>
</svg>
