<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <clipPath id="c5"><circle cx="20" cy="20" r="20"/></clipPath>
  <g clip-path="url(#c5)">
    <!-- BG: deep navy/night -->
    <rect width="40" height="40" fill="#1a1a3e"/>
    <rect y="24" width="40" height="16" fill="#0f0f2e"/>
    <!-- Stars in BG -->
    <circle cx="6" cy="6" r="1" fill="white" opacity="0.7"/>
    <circle cx="34" cy="4" r="1.2" fill="white" opacity="0.9"/>
    <circle cx="30" cy="10" r="0.8" fill="white" opacity="0.5"/>
    <circle cx="5" cy="18" r="0.8" fill="white" opacity="0.4"/>
    <!-- Moon accent -->
    <circle cx="32" cy="8" r="5" fill="#f2c94c" opacity="0.8"/>
    <circle cx="35" cy="6" r="4" fill="#1a1a3e"/>
    <!-- Hair (long dark with blue tinge) -->
    <rect x="5" y="4" width="30" height="20" rx="10" fill="#1a1a5e"/>
    <!-- Side hair strands -->
    <rect x="5" y="12" width="8" height="18" rx="4" fill="#1a1a5e"/>
    <rect x="27" y="12" width="8" height="18" rx="4" fill="#1a1a5e"/>
    <!-- Face -->
    <rect x="11" y="13" width="18" height="18" rx="5" fill="#d0c0e8"/>
    <!-- Eyes (half-closed = sleepy/cool) -->
    <rect x="13" y="19" width="6" height="4" rx="2" fill="#1a1a2e"/>
    <rect x="21" y="19" width="6" height="4" rx="2" fill="#1a1a2e"/>
    <!-- Eye shine -->
    <rect x="14" y="19.5" width="2" height="2" rx="1" fill="white" opacity="0.8"/>
    <rect x="22" y="19.5" width="2" height="2" rx="1" fill="white" opacity="0.8"/>
    <!-- Eyelash top -->
    <rect x="13" y="18.5" width="6" height="1.5" rx="0.5" fill="#1a1a2e"/>
    <rect x="21" y="18.5" width="6" height="1.5" rx="0.5" fill="#1a1a2e"/>
    <!-- Small cool smile -->
    <path d="M 15 25 Q 20 27 25 25" stroke="#9070b8" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
