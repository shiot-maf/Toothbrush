# 이 리포의 GitHub Pages 사이트를 만든다.
#
# Pages 사이트는 리포당 하나뿐이다. 예전에는 Pages가 "Deploy from a branch"
# 모드였고 GitHub 내장 Jekyll 빌더가 리포 소스를 그대로 올리고 있었다.
# 거기에 이 워크플로를 얹으면서 발행자가 둘이 됐고, 같은 푸시에 둘 다 떠서
# 나중에 끝난 쪽이 덮어썼다. 이제 발행자는 이 워크플로 하나다.
#
# ERRATA는 전용 리포(shiot-maf/Errata)로 독립했다. 여기서는 예전 주소로 들어오는
# 북마크와 이미 설치된 PWA를 새 주소로 보내주기만 한다.
name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "attraction-journal/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ERRATA_URL: https://shiot-maf.github.io/Errata/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p site

          # attraction-journal — 빌드가 없는 정적 파일. 예전 Jekyll이 소스를
          # 그대로 복사해 서빙하던 것과 결과가 같으므로 주소도 그대로 유지된다.
          mkdir -p site/attraction-journal
          cp -r attraction-journal/. site/attraction-journal/

          # ERRATA가 쓰던 예전 주소 둘을 새 리포로 보낸다. 설치된 PWA와
          # 북마크가 죽지 않도록 남겨둔다.
          for old in errata echo-diary; do
            mkdir -p "site/$old"
            cat > "site/$old/index.html" <<HTML
          <!doctype html>
          <meta charset="utf-8">
          <title>ERRATA</title>
          <meta http-equiv="refresh" content="0; url=${ERRATA_URL}">
          <p>ERRATA는 전용 리포로 옮겼습니다.
             <a href="${ERRATA_URL}">새 주소로 이동</a></p>
          HTML
          done

          # 루트는 목록을 보여준다.
          cat > site/index.html <<HTML
          <!doctype html>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Toothbrush</title>
          <style>
            body { margin: 0; padding: 48px 24px; font: 16px/1.6 system-ui, sans-serif;
                   color: #1c1917; background: #faf7f1; }
            main { max-width: 32rem; margin: 0 auto; }
            h1 { font-size: 14px; letter-spacing: .12em; text-transform: uppercase;
                 color: #78716c; font-weight: 600; margin: 0 0 24px; }
            ul { list-style: none; padding: 0; margin: 0; }
            li { border-top: 1px solid #e7e0d6; }
            a { display: block; padding: 16px 0; color: inherit; text-decoration: none; }
            a:hover { color: #b91c1c; }
            b { display: block; font-size: 18px; }
            span { color: #78716c; font-size: 14px; }
            @media (prefers-color-scheme: dark) {
              body { background: #17150f; color: #e8e3d9; }
              li { border-color: #2a2621; }
              h1, span { color: #8a827a; }
              a:hover { color: #e8785f; }
            }
          </style>
          <main>
            <h1>Toothbrush</h1>
            <ul>
              <li><a href="./attraction-journal/"><b>끌어당김 저널</b><span>오늘의 나 · 미리 감사 · HARD 노트</span></a></li>
              <li><a href="${ERRATA_URL}"><b>ERRATA &rarr;</b><span>영어일기를 쓰고, 틀린 것을 세어 둡니다 — 전용 리포로 이전</span></a></li>
            </ul>
          </main>
          HTML

          touch site/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
