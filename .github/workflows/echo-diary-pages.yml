name: Deploy Echo Diary to Pages

on:
  push:
    branches:
      - main
      - claude/english-diary-learning-app-kk9diu
    paths:
      - "echo-diary/**"
      - ".github/workflows/echo-diary-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 배포를 취소하지는 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: echo-diary/package-lock.json

      - name: Install
        working-directory: echo-diary
        run: npm ci

      - name: Typecheck
        working-directory: echo-diary
        run: npx tsc --noEmit

      # Pages는 사이트를 리포 이름 아래에 서빙한다. 이 앱은 모노레포의 한 프로젝트라
      # 다시 echo-diary/ 아래에 두어 나중에 다른 프로젝트가 들어올 자리를 남긴다.
      - name: Build (static export)
        working-directory: echo-diary
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}/echo-diary
        run: npm run build

      - name: Assemble site
        run: |
          mkdir -p site/echo-diary
          cp -r echo-diary/out/. site/echo-diary/
          # Pages 루트로 들어온 사람을 앱으로 보내준다
          cat > site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Toothbrush</title>
          <meta http-equiv="refresh" content="0; url=./echo-diary/">
          <a href="./echo-diary/">Echo Diary</a>
          HTML
          # Pages가 _next 같은 밑줄 폴더를 Jekyll로 삼키지 않게 한다
          touch site/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
