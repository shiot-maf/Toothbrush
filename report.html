<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주간 리포트 — 끌어당김의 기록</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="theme-color" content="#3B6D11">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="끌어당김의 기록">
</head>
<body>
  <div class="phone-frame">
    <div class="header">
      <button class="header-back" onclick="history.back()">‹</button>
      <span class="header-title">이번 주 리포트</span>
      <div class="header-actions">
        <button class="icon-btn" id="themeBtn">🌙</button>
      </div>
    </div>

    <div class="page-content" id="reportContent">
      <div style="text-align:center;padding:40px 0;color:var(--text-hint);">불러오는 중…</div>
    </div>
  </div>

  <script type="module">
    import { onAuthChange, getThisWeekEntries, getWeekKey, formatDate } from './firebase.js';

    // ── 테마 ──────────────────────────────────────────────────────────────
    const root = document.documentElement;
    const themeBtn = document.getElementById('themeBtn');
    function applyTheme(t) {
      root.setAttribute('data-theme', t);
      themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
    }
    applyTheme(localStorage.getItem('theme') || 'light');
    themeBtn.addEventListener('click', () => {
      const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      localStorage.setItem('theme', next);
      applyTheme(next);
    });

    // ── 유틸 ──────────────────────────────────────────────────────────────
    const DAYS = ['월', '화', '수', '목', '금', '토', '일'];

    function extractKeywords(text) {
      if (!text) return [];
      return text
        .split(/[\s,·]+/)
        .map(w => w.replace(/[^가-힣a-zA-Z0-9]/g, '').trim())
        .filter(w => w.length >= 2);
    }

    function topKeywords(list, limit = 10) {
      const freq = {};
      list.forEach(w => { freq[w] = (freq[w] || 0) + 1; });
      return Object.entries(freq)
        .sort((a, b) => b[1] - a[1])
        .slice(0, limit)
        .map(([w]) => w);
    }

    function encouragement(diaryCount, gratCount, hardDone) {
      const lines = [
        `이번 주 ${diaryCount}번의 자기증명 일기와 ${gratCount}번의 감사를 기록했어요. 꾸준히 쌓이는 당신이 멋집니다.`,
        `기록은 거짓말을 하지 않습니다. 이번 주 당신은 분명히 움직였어요.`,
        `작은 글자 하나하나가 현실을 끌어당기고 있어요. 계속 써주세요.`,
        `이번 주도 자신에게 집중한 시간이 있었습니다. 그게 전부예요.`,
        `감사의 감정이 쌓일수록 인식이 달라집니다. 당신은 잘 하고 있어요.`,
      ];
      const extra = hardDone ? ' HARD 노트까지 채운 한 주, 정말 대단합니다.' : '';
      return lines[diaryCount % lines.length] + extra;
    }

    // ── 주간 날짜 목록 생성 (월~일) ─────────────────────────────────────
    function weekDates(startDate) {
      const dates = [];
      const start = new Date(startDate);
      for (let i = 0; i < 7; i++) {
        const d = new Date(start);
        d.setDate(start.getDate() + i);
        dates.push(formatDate(d));
      }
      return dates;
    }

    // ── 리포트 렌더 ───────────────────────────────────────────────────────
    function render({ diary, gratitude, hard, startDate, endDate }) {
      const dates     = weekDates(startDate);
      const diaryDays = dates.filter(d => diary[d]);
      const gratDays  = dates.filter(d => gratitude[d]);
      const hardDone  = !!hard;

      // 감사 항목 전체 수집
      const allGratTexts = [];
      gratDays.forEach(d => {
        (gratitude[d].gratitudes || []).forEach(g => { if (g) allGratTexts.push(g); });
      });

      // 자기증명 선언 키워드
      const declWords = [];
      diaryDays.forEach(d => {
        if (diary[d].declaration) declWords.push(...extractKeywords(diary[d].declaration));
      });

      // 감사 키워드
      const gratWords = [];
      allGratTexts.forEach(t => gratWords.push(...extractKeywords(t)));

      // ── 요일별 점 그리드 ────────────────────────────────────────────────
      const weekGridHTML = dates.map((date, i) => {
        const has17 = !!diary[date];
        const has21 = !!gratitude[date];
        // HARD는 주 단위 — 해당 주에 작성됐으면 일요일(i=6)에 표시
        const has28 = hardDone && i === 6;
        return `
          <div class="week-col">
            <div class="week-col-label">${DAYS[i]}</div>
            <div class="week-dots">
              <div class="dot ${has17 ? 'on-17' : ''}"></div>
              <div class="dot ${has21 ? 'on-21' : ''}"></div>
              <div class="dot ${has28 ? 'on-28' : ''}"></div>
            </div>
          </div>`;
      }).join('');

      // ── 정체성 키워드 ───────────────────────────────────────────────────
      const identKeywords = topKeywords(declWords, 8);
      const identHTML = identKeywords.length
        ? identKeywords.map(k => `<span class="chip chip-17">${k}</span>`).join('')
        : '<span style="color:var(--text-hint);font-size:13px;">이번 주 기록이 없어요</span>';

      // 전체 선언문 목록
      const declListHTML = diaryDays.length
        ? diaryDays.map(d =>
            `<div style="font-size:13px;color:var(--text-secondary);margin-bottom:4px;">
               <span style="color:var(--text-hint);margin-right:6px;">${d.slice(5)}</span>
               나는 ${diary[d].declaration} 한 사람이다.
             </div>`
          ).join('')
        : '';

      // ── 감사 키워드 ─────────────────────────────────────────────────────
      const gratKeywords = topKeywords(gratWords, 10);
      const gratHTML = gratKeywords.length
        ? gratKeywords.map(k => `<span class="chip chip-21">${k}</span>`).join('')
        : '<span style="color:var(--text-hint);font-size:13px;">이번 주 감사 기록이 없어요</span>';

      const weekKey = getWeekKey(new Date(startDate));

      document.getElementById('reportContent').innerHTML = `
        <!-- 기간 표시 -->
        <div style="font-size:12px;color:var(--text-hint);margin-bottom:20px;">
          ${startDate} ~ ${endDate} &nbsp;·&nbsp; ${weekKey}주차
        </div>

        <!-- 1. 기록 현황 -->
        <div class="section">
          <div class="section-title">이번 주 기록 현황</div>
          <div class="stat-row">
            <div class="stat-box">
              <div class="stat-value" style="color:var(--c17);">${diaryDays.length}</div>
              <div class="stat-label">자기증명 일기</div>
            </div>
            <div class="stat-box">
              <div class="stat-value" style="color:var(--c21);">${gratDays.length}</div>
              <div class="stat-label">감사 기록</div>
            </div>
            <div class="stat-box">
              <div class="stat-value" style="color:var(--c21);">${allGratTexts.filter(Boolean).length}</div>
              <div class="stat-label">감사 항목 수</div>
            </div>
          </div>
          <div class="card" style="padding:14px 16px;">
            <div class="field-label" style="margin-bottom:10px;">요일별 작성 현황</div>
            <div style="display:flex;gap:6px;font-size:10px;color:var(--text-hint);margin-bottom:6px;">
              <span style="display:inline-flex;align-items:center;gap:3px;"><span class="dot on-17" style="width:7px;height:7px;"></span>자기증명</span>
              <span style="display:inline-flex;align-items:center;gap:3px;"><span class="dot on-21" style="width:7px;height:7px;"></span>감사</span>
              <span style="display:inline-flex;align-items:center;gap:3px;"><span class="dot on-28" style="width:7px;height:7px;"></span>HARD</span>
            </div>
            <div class="week-grid">${weekGridHTML}</div>
          </div>
        </div>

        <div class="separator"></div>

        <!-- 2. 이번 주 나의 정체성 -->
        <div class="section">
          <div class="section-title">이번 주 나의 정체성</div>
          <div class="chips">${identHTML}</div>
          ${declListHTML
            ? `<div style="margin-top:12px;">${declListHTML}</div>`
            : ''}
        </div>

        <div class="separator"></div>

        <!-- 3. 감사 키워드 -->
        <div class="section">
          <div class="section-title">이번 주 주요 감사 키워드</div>
          <div class="chips">${gratHTML}</div>
        </div>

        <div class="separator"></div>

        <!-- 4. 격려 메시지 -->
        <div class="section">
          <div class="section-title">이번 주를 돌아보며</div>
          <div class="encouragement">
            ${encouragement(diaryDays.length, gratDays.length, hardDone)}
          </div>
        </div>
      `;
    }

    // ── 인증 + 데이터 로드 ────────────────────────────────────────────────
    onAuthChange(async user => {
      if (!user) { window.location.replace('index.html'); return; }
      try {
        const data = await getThisWeekEntries(user.uid);
        render(data);
      } catch (e) {
        document.getElementById('reportContent').innerHTML =
          '<div style="text-align:center;padding:40px 0;color:var(--text-hint);">데이터를 불러오지 못했습니다.</div>';
      }
    });
  </script>
</body>
</html>
